server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Caddy terminates TLS and proxies to us over plain http, so nginx's own idea of the
    # scheme is "http". Left on, its automatic trailing-slash redirect would send the
    # browser an absolute "http://host/dir/" - Caddy would bounce that straight back to
    # https, and the two would trade redirects until the browser gave up. Relative
    # Location headers keep whatever scheme the client actually used.
    absolute_redirect off;

    # Hashed assets are immutable; everything else must revalidate so a new deploy is
    # picked up on the next load (index.html and config.js in particular).
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /config.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # The crypto engine is served as wasm; make sure the MIME type is right.
    types {
        application/wasm wasm;
        text/html html;
        text/css css;
        application/javascript js mjs;
        application/json json;
        image/svg+xml svg;
        image/png png;
        image/x-icon ico;
        font/woff2 woff2;
        font/woff woff;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
}
