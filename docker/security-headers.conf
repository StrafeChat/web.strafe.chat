# Response headers for the static client. Included in every `location` block because an
# `add_header` inside a location replaces - not extends - the headers inherited from the
# server block, so setting these once at the top would silently drop them wherever a
# location sets its own Cache-Control.
#
# The Content-Security-Policy lives in index.html as a <meta> tag rather than here, so it
# applies identically in development, behind Caddy, and from this image on its own.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
