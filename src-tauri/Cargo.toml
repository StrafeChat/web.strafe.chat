[package]
name = "strafe-desktop"
version = "1.0.0"
description = "Strafe - the desktop app"
authors = ["StrafeChat"]
license = "MIT"
repository = "https://github.com/StrafeChat/web.strafe.chat"
edition = "2021"
rust-version = "1.77.2"

# The frontend is the web client in ../src; this crate is the native shell around it. See
# ../src/desktop/ for the half that runs inside the webview.

[lib]
name = "strafe_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Desktop-only plugins (no mobile build exists today, but the cfg keeps the door open).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"

# WebKitGTK ships with WebRTC and getUserMedia switched off; voice needs both (see lib.rs).
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_38"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
