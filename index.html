<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="/src/index.css" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />
    <title>Strafe</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
  <script>
    (function () {
      const savedTheme = localStorage.getItem("sc_theme");
      const root = document.documentElement;

      if (savedTheme) {
        const theme = JSON.parse(savedTheme);

        // Apply all theme colors to ensure consistent styling
        root.style.setProperty("--primary", theme.colors.primary || "#21c35e");
        root.style.setProperty("--background", theme.colors.background || "#000000");
        root.style.setProperty("--background0", theme.colors.background0 || "#111111");
        root.style.setProperty("--background1", theme.colors.background1 || "#222222");
        root.style.setProperty("--background2", theme.colors.background2 || "#333333");
        root.style.setProperty("--foreground", theme.colors.foreground || "#ffffff");
        root.style.setProperty("--accent", theme.colors.accent || "#1a9d4b");
        root.style.setProperty("--surface", theme.colors.surface || "#333333");
        root.style.setProperty("--text-primary", theme.colors.text?.primary || "#ffffff");
        root.style.setProperty("--text-secondary", theme.colors.text?.secondary || "#aaaaaa");
        root.style.setProperty("--text-accent", theme.colors.text?.accent || "#21c35e");
        root.style.setProperty("--text-inverse", theme.colors.text?.inverse || "#000000");
        root.style.setProperty("--border", theme.colors.border || "#444444");
        root.style.setProperty("--error", theme.colors.error || "#ff3b30");
        root.style.setProperty("--success", theme.colors.success || "#34c759");
        root.style.setProperty("--warning", theme.colors.warning || "#ffcc00");
      } else {
        // Apply dark theme as default
        root.style.setProperty("--primary", "#21c35e");
        root.style.setProperty("--background", "#000000");
        root.style.setProperty("--background0", "#111111");
        root.style.setProperty("--background1", "#222222");
        root.style.setProperty("--background2", "#333333");
        root.style.setProperty("--foreground", "#ffffff");
        root.style.setProperty("--accent", "#1a9d4b");
        root.style.setProperty("--surface", "#333333");
        root.style.setProperty("--text-primary", "#ffffff");
        root.style.setProperty("--text-secondary", "#aaaaaa");
        root.style.setProperty("--text-accent", "#21c35e");
        root.style.setProperty("--text-inverse", "#000000");
        root.style.setProperty("--border", "#444444");
        root.style.setProperty("--error", "#ff3b30");
        root.style.setProperty("--success", "#34c759");
        root.style.setProperty("--warning", "#ffcc00");
      }

      // Turtle animation keyframes
      const style = document.createElement("style");
      style.textContent = `
        @keyframes swim1 {
          0% { transform: translateY(0) rotate(-10deg) scale(1); }
          20% { transform: translateY(-10px) rotate(-5deg) scale(1.05); }
          40% { transform: translateY(5px) rotate(0deg) scale(1.1); }
          60% { transform: translateY(-8px) rotate(5deg) scale(1.05); }
          80% { transform: translateY(0) rotate(-5deg) scale(1); }
          100% { transform: translateY(0) rotate(-10deg) scale(1); }
        }
        @keyframes swim2 {
          0% { transform: translateY(0) rotate(8deg) scale(1); }
          25% { transform: translateY(-12px) rotate(0deg) scale(1.08); }
          50% { transform: translateY(8px) rotate(-8deg) scale(1.12); }
          75% { transform: translateY(-6px) rotate(0deg) scale(1.08); }
          100% { transform: translateY(0) rotate(8deg) scale(1); }
        }
        @keyframes swim3 {
          0% { transform: translateY(0) rotate(0deg) scale(1); }
          15% { transform: translateY(-8px) rotate(5deg) scale(1.04); }
          30% { transform: translateY(6px) rotate(-5deg) scale(1.08); }
          45% { transform: translateY(-10px) rotate(0deg) scale(1.12); }
          60% { transform: translateY(0) rotate(-5deg) scale(1.08); }
          100% { transform: translateY(0) rotate(0deg) scale(1); }
        }
        .animate-swim-1 { animation: swim1 4s ease-in-out infinite; }
        .animate-swim-2 { animation: swim2 5s ease-in-out infinite; }
        .animate-swim-3 { animation: swim3 6s ease-in-out infinite; }
        .strafe-shadow { color: #21c35e; text-shadow: 0 2px 16px #21c35e55, 0 1px 0 #fff; letter-spacing: 0.05em; }
      `;
      document.head.appendChild(style);

      // Custom bottom texts
      const bottomTexts = [
        "Connecting to STRAFE",
        "Loading your experience",
        "Making things awesome",
        "Almost there"
      ];
      const text = bottomTexts[Math.floor(Math.random() * bottomTexts.length)];

      const TURTLE_SRC = "https://raw.githubusercontent.com/googlefonts/noto-emoji/main/png/512/emoji_u1f422.png";

      const loadingScreen = document.createElement("div");
      loadingScreen.innerHTML = `
        <div class="fixed inset-0 flex flex-col justify-center items-center transition-opacity duration-500 z-50" style="background: #1a1b26; z-index: 50;">
          <div class="absolute inset-0 opacity-40 pointer-events-none select-none">
            <img src='${TURTLE_SRC}' alt="Turtle" class="absolute w-24 h-24 animate-swim-1" style="top: 20%; left: 10%;" />
            <img src='${TURTLE_SRC}' alt="Turtle" class="absolute w-16 h-16 animate-swim-2" style="top: 60%; right: 15%;" />
            <img src='${TURTLE_SRC}' alt="Turtle" class="absolute w-20 h-20 animate-swim-3" style="bottom: 15%; left: 30%;" />
            <img src='${TURTLE_SRC}' alt="Turtle" class="absolute w-16 h-16 animate-swim-1" style="top: 40%; right: 30%;" />
            <img src='${TURTLE_SRC}' alt="Turtle" class="absolute w-24 h-24 animate-swim-2" style="bottom: 30%; right: 40%;" />
          </div>
          <div class="absolute inset-0 bg-gradient-to-br from-[#1a1b26]/80 via-[#1a1b26]/60 to-[#1a1b26]/90 pointer-events-none select-none"></div>
          <div class="relative flex flex-col items-center justify-center w-full h-full z-10">
            <h1 class="text-5xl md:text-6xl font-extrabold tracking-tight text-center strafe-shadow">STRAFE</h1>
            <div class="mt-8 flex flex-col items-center">
              <div class="w-16 h-16 border-4 rounded-full animate-spin" style="border-color: #21c35e; border-top-color: transparent;"></div>
            </div>
            <div class="absolute bottom-10 left-0 w-full flex flex-col items-center">
              <p id="strafe-loading-text" class="text-lg font-medium text-text-primary drop-shadow mb-2" style="color: #fff; text-shadow: 0 1px 8px #21c35e55;">${text}<span id="strafe-dots"></span></p>
              <p class="text-sm text-text-secondary" style="color: #b5ffcb;">Please wait while we prepare everything for you</p>
            </div>
          </div>
        </div>
      `;
      loadingScreen.style.position = "fixed";
      loadingScreen.style.inset = "0";
      loadingScreen.style.zIndex = "50";
      document.body.appendChild(loadingScreen);

      // Animate dots after the bottom text
      let dots = "";
      let dotInterval = setInterval(() => {
        if (dots.length >= 3) {
          dots = "";
        } else {
          dots += ".";
        }
        const dotsEl = document.getElementById("strafe-dots");
        if (dotsEl) dotsEl.textContent = dots;
      }, 500);

      // Expose function to remove loading screen from SolidJS app
      window.removeInitialLoadingScreen = function() {
        clearInterval(dotInterval);
        if (document.body.contains(loadingScreen)) {
          loadingScreen.firstElementChild.style.opacity = "0";
          setTimeout(() => {
            if (document.body.contains(loadingScreen)) {
              document.body.removeChild(loadingScreen);
            }
          }, 300);
        }
      };
      setTimeout(() => {
        if (window.removeInitialLoadingScreen) {
          window.removeInitialLoadingScreen();
        }
      }, 10000);
    })();
  </script>
</html>
